[package]
name = "homedit"
description = "Self-hosted homelab dashboard with a built-in editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "homedit"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
futures.workspace = true
homedit-core.workspace = true
homedit-db.workspace = true
homedit-auth.workspace = true
homedit-discovery.workspace = true
homedit-import.workspace = true
homedit-ops.workspace = true
homedit-scanner.workspace = true
homedit-widgets.workspace = true
kit-server-core.workspace = true
kit-server-health.workspace = true
kit-server-changelog = { workspace = true, features = ["server"] }
kit-server-notices.workspace = true
kit-server-bugreports.workspace = true
kit-server-diagnostics.workspace = true
kit-server-settings = { workspace = true, features = ["toml", "server"] }
sqlx.workspace = true
mime_guess.workspace = true
reqwest.workspace = true
rust-embed.workspace = true
rustix = { version = "1", features = ["fs"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[build-dependencies]
kit-server-settings = { workspace = true, features = ["toml"] }
kit-server-changelog.workspace = true

[dev-dependencies]
http-body-util.workspace = true
tempfile.workspace = true
tower.workspace = true
