[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/Krifmaz/homedit"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
futures = "0.3"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
mime_guess = "2"
prometheus-client = "0.25"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "http2"] }
rust-embed = { version = "8", features = ["mime-guess", "include-exclude"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros", "json"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "fs", "compression-gzip", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
# The Krifmaz kit (github.com/Krifmaz/kit), pinned to one release tag. To update: read the kit's
# CHANGELOG.md, bump the tag on every line, run the tests.
kit-server-core = { git = "https://github.com/Krifmaz/kit", tag = "v0.2.0", features = ["sqlite"] }
kit-server-health = { git = "https://github.com/Krifmaz/kit", tag = "v0.2.0" }
kit-server-changelog = { git = "https://github.com/Krifmaz/kit", tag = "v0.2.0", default-features = false }
kit-server-notices = { git = "https://github.com/Krifmaz/kit", tag = "v0.2.0" }
kit-server-bugreports = { git = "https://github.com/Krifmaz/kit", tag = "v0.2.0" }
kit-server-diagnostics = { git = "https://github.com/Krifmaz/kit", tag = "v0.2.0" }
kit-server-settings = { git = "https://github.com/Krifmaz/kit", tag = "v0.2.0", default-features = false }
homedit-core = { path = "crates/core" }
homedit-db = { path = "crates/db" }
homedit-auth = { path = "crates/auth" }
homedit-widgets = { path = "crates/widgets" }
homedit-scanner = { path = "crates/scanner" }
homedit-discovery = { path = "crates/discovery" }
homedit-import = { path = "crates/import" }
homedit-ops = { path = "crates/ops" }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
panic = "abort"
