# Releases, on the Krifmaz kit's shared workflows.
#
# Every push to main makes a normal vX.Y.Z release (never a pre-release):
#   1. test:    the kit's checks (kit-ci), the same as CI's,
#   2. prepare: the version (kit-release): PATCH by default, MINOR or MAJOR when
#      the merge added docs/releases/<that version>.md,
#   3. docker:  the amd64 + arm64 image on GHCR as `X.Y.Z`, `X.Y` and `latest`
#      (kit-docker), with the version built in as HOMEDIT_VERSION,
#   4. publish: the GitHub Release (kit-release) with docs/releases/<version>.md
#      as its notes (else the commits since the last release), the static
#      binaries for both architectures taken from the image, and SHA256SUMS.
#
# Run it by hand (Actions > Release > Run workflow) to release the current
# main, optionally with a bump or an explicit version.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "auto (PATCH, or MINOR/MAJOR from docs/releases/<version>.md), patch, minor or major"
        required: false
        default: auto
      version:
        description: "Version to release (X.Y.Z). Empty = from bump."
        required: false

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    uses: Krifmaz/kit/.github/workflows/kit-ci.yml@v0.2.1
    with:
      rust-dirs: .
      wasm-dirs: web
      check: scripts/kit-css-check.sh

  prepare:
    needs: test
    uses: Krifmaz/kit/.github/workflows/kit-release.yml@v0.2.1
    with:
      stage: prepare
      app-name: homedit
      bump: ${{ inputs.bump || 'auto' }}
      version: ${{ inputs.version || '' }}

  # `X.Y` beside the kit's `X.Y.Z` and `latest`, so `ghcr.io/…/homedit:0.3` follows patch releases.
  tags:
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      minor: ${{ steps.t.outputs.minor }}
    steps:
      - id: t
        env:
          V: ${{ needs.prepare.outputs.version }}
        run: echo "minor=${V%.*}" >> "$GITHUB_OUTPUT"

  docker:
    needs: [prepare, tags]
    uses: Krifmaz/kit/.github/workflows/kit-docker.yml@v0.2.1
    with:
      image: homedit
      version: ${{ needs.prepare.outputs.version }}
      extra-tags: ${{ needs.tags.outputs.minor }}
      build-args: |
        VERSION=${{ needs.prepare.outputs.version }}
        REVISION=${{ github.sha }}

  publish:
    needs: [prepare, docker]
    uses: Krifmaz/kit/.github/workflows/kit-release.yml@v0.2.1
    with:
      stage: publish
      app-name: homedit
      version: ${{ needs.prepare.outputs.version }}
      # the static binaries, taken from the image just pushed
      files: |
        set -euo pipefail
        image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/homedit:${V}"
        mkdir -p "$OUT"
        for arch in amd64 arm64; do
          docker pull -q --platform "linux/${arch}" "$image"
          id=$(docker create --platform "linux/${arch}" "$image")
          stage="homedit-v${V}-linux-${arch}"
          mkdir -p "$stage"
          docker cp "${id}:/homedit" "${stage}/homedit"
          docker rm "$id" >/dev/null
          cp LICENSE README.md "$stage/"
          tar -czf "$OUT/${stage}.tar.gz" "$stage"
        done
