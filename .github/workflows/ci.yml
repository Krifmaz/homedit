# Continuous integration for homedit.
#
# Every push and pull request runs the kit's shared checks (formatting,
# clippy, tests of the server and the web app), the web build, a dependency
# licence/advisory check and a multi-arch image build. Pushes
# to main publish `ghcr.io/<owner>/homedit:edge`. Versioned images, tags
# and GitHub Releases come from release.yml once this workflow passes.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Limits from the project spec, checked by the smoke test.
  MAX_IMAGE_MB: 40
  MAX_IDLE_MEM_MB: 50

jobs:
  # fmt, clippy -D warnings and tests of the server workspace and the web app (kit-ci), plus homedit's own checks:
  # the kit's stylesheets against the pinned kit, the API docs and the web build.
  test:
    uses: Krifmaz/kit/.github/workflows/kit-ci.yml@v0.2.0
    with:
      rust-dirs: .
      wasm-dirs: web
      check: |
        set -euo pipefail
        scripts/kit-css-check.sh
        RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked
        curl -sSfL "https://github.com/trunk-rs/trunk/releases/download/v0.22.1/trunk-x86_64-unknown-linux-gnu.tar.gz" \
          | tar -xz -C "$HOME/.cargo/bin" trunk
        (cd web && trunk build --release --locked)

  deny:
    name: Licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories bans sources

  image:
    name: Docker image (amd64, arm64)
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/homedit
          tags: |
            type=edge,branch=main
            type=sha,format=short
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build amd64 alone first and load it, so the smoke test can run it.
      - name: Build amd64 for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: homedit:ci
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64
      - name: Smoke test (size, health, idle memory)
        run: scripts/smoke-test.sh homedit:ci

      - name: Build amd64 + arm64 (push on main and tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          provenance: false
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64
